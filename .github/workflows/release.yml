name: Publish plugin release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish versioned package
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.slice(10) : 'v2.0.0';
            const packages = {
              'v1.1.2': 'release-packages/AI-Skills管理器-1.1.2-Joel.zpx',
              'v1.1.3': 'release-packages/AI-Skills管理器-1.1.3-Joel.zpx',
              'v1.2.0': 'skills-manager-1.2.0.zpx',
              'v1.2.1': 'skills-manager-1.2.1.zpx',
              'v2.0.0': 'skillhub-2.0.0.zpx',
              'v2.0.3': 'skillhub-2.0.3.zpx',
              'v2.3.1': 'skillhub-2.3.1.zpx'
            };
            const file = packages[tag];
            if (!file || !fs.existsSync(file)) throw new Error('No verified package mapped for ' + tag);
            const historical = ['v1.1.2', 'v1.1.3'].includes(tag);
            const notes = {
              'v2.3.1': 'SkillHub 最终单页版：移除侧栏和商店，顶部导入菜单统一 GitHub 仓库/本地ZIP/文件夹/清单；新增本地导入安全预览与已有Skill仓库关联，关联后更新保留本地目录。卡片缩略图顶对齐两行头部、描述全宽、日期一行紧凑显示。保留昵称悬停原名、主页说明、Codex/自定义/其他三项安装目标、进度和备份替换。\n\n安装：ZTools插件管理导入下方skillhub-2.3.1.zpx，插件ID仍为skillhub。宿主模拟浏览器交互与后端测试通过，实际ZTools需手动确认。本地导入来源不会自动获得更新能力，需先验证关联GitHub。备份目录不会自动删除，请自行确认后清理。',
              'v2.0.3': '修复 Codex 目录及目录映射被误标为 OpenClaw：使用完整路径、真实路径和边界匹配，自定义路径不再被通用 skills 规则抢先归类。合并 2.0.1–2.0.2 改进：紧凑昵称弹窗，Codex/自定义路径/其他安装目标同行，其他工具按需展开，使用说明打开 GitHub 仓库主页。安装方式：在 ZTools 插件管理导入 skillhub-2.0.3.zpx。插件 ID 仍为 skillhub。测试与模拟宿主浏览器交互已验证，真实 ZTools 需手动确认。',
              'v2.0.0': 'SkillHub · 技能库，作者 Joel。ZTools 插件 ID 改为 skillhub，新品牌叠层图标；GitHub 仓库保持不变。只保留 Codex 安装目标，昵称在标题直接展示、原名仅悬停显示，文档/目录/编辑统一图标。说明优先打开 GitHub 来源，无来源回退本地文档；支持目录映射，修复临时目录清理掩盖错误。保留发行附件、发行快照、真实进度和备份安装。\n\n重要：新 ID 不覆盖旧插件，沿用磁盘安装记录；旧插件浏览器存储昵称不会自动迁移。请勿新旧同时操作。此仓库是 ZTools 插件，请下载 .zpx 到 ZTools 插件管理导入，不是 Skill 包。实际 ZTools 宿主仍需手动验证。',
              'v1.2.1': '修复预览失败时临时目录清理 EPERM 掩盖真实错误的问题。找不到 SKILL.md 时明确提示，不再让清理失败替代原因。此仓库是 ZTools 插件，请下载 .zpx 并在 ZTools 插件管理中导入，不要作为 Skill 仓库安装。',
              'v1.1.2': '历史版本，仅用于回溯，不推荐安装。已知问题：ZIP 解包可能出现 setImmediate 未定义，源码安装可能在清理 .git 时出现 EPERM。请使用 v1.2.0。',
              'v1.1.3': '历史版本，仅用于回溯。修复 setImmediate 和 .git 复制问题，但尚不包含分阶段安装进度、发行版源码快照和最新版本提示。请优先使用 v1.2.0。',
              'v1.2.0': '支持发行附件及发行版源码快照选择、下载/解包/安装真实分阶段进度、已是最新发行版提示、README 预览、真实刷新和备份式替换。80 项测试通过，实际 ZTools 宿主仍需手动验证。\n\n安装：在 ZTools 插件管理中导入下方 .zpx。应用 ID 为 ai-skills-manager，会作为同 ID 插件升级，请先备份安装记录与重要 Skill。Git 来源更新仍可能重新克隆，不承诺按提交跳过。'
            };
            const body = notes[tag] + '\n\n注意：历史标签在同一发布目录提交上建立，用于归档原始安装包，不代表该标签的源码与历史安装包完全一致。旧版安装包为原样保留，未重新构建。';
            const owner = context.repo.owner, repo = context.repo.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              release = (await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, name: tag + (historical ? '（历史版本）' : ''), body, prerelease: historical, make_latest: historical ? 'false' : 'true' })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: context.sha, name: tag + (historical ? '（历史版本）' : ''), body, prerelease: historical, make_latest: historical ? 'false' : 'true' })).data;
            }
            const name = path.basename(file);
            const existing = (await github.rest.repos.listReleaseAssets({ owner, repo, release_id: release.id })).data;
            if (!existing.some(asset => asset.name === name)) {
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data, headers: { 'content-type': 'application/octet-stream', 'content-length': data.length } });
            }
            core.notice('Published ' + release.html_url);
